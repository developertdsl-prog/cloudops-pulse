version: '3.8'

services:
  cloudops-api:
    build: .
    container_name: cloudops_api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/cloudops_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=prod_secret_cloudops_2024
      - DEFAULT_SLO_TARGET=99.9
    depends_on:
      - mongo
      - redis
    restart: always

  mongo:
    image: mongo:6.0
    container_name: cloudops_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cloudops_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo_data:
